<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" role="img" aria-labelledby="agents-get-names-title agents-get-names-desc">
<title id="agents-get-names-title">Agents get their own names, 2025 to 2026</title>
<desc id="agents-get-names-desc">Within about eighteen months, four identity vendors shipped identities for AI agents, while the Model Context Protocol added OAuth-based authorization.</desc>
