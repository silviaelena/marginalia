  .note{fill:#6b6253;font:italic 14px Georgia, 'Times New Roman', serif} .eyebrow{fill:#6b6253;font:9px ui-monospace, Menlo, Consolas, monospace;letter-spacing:.14em}
  @media (prefers-color-scheme: dark) {
    .bg,.paper{fill:#1b1915} .box{fill:#1b1915;stroke:#ece6d8} .box-acc{fill:#1b1915;stroke:#d9a066}
    .life{stroke:#ece6d8} .bar{fill:#2e2a23;stroke:#a39a89}
    .call,.ret{stroke:#a39a89} .hl{stroke:#d9a066} .rule{stroke:#4a443a}
    .mk{fill:#a39a89} .mk-acc,.dot-acc{fill:#d9a066} .dot{fill:#ece6d8}
    .name,.name-s{fill:#ece6d8} .sub,.lbl,.note,.eyebrow{fill:#a39a89} .lbl-acc{fill:#d9a066}
  }
</style>
