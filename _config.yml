title: marginalia
description: Small lessons from the day job, each with a runnable demo. Notes from the margins, illustrated with public-domain art.
author: Silvia Nistor
url: https://silviaelena.github.io
baseurl: /marginalia
lang: en

plugins:
  - jekyll-seo-tag

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "lessons/*/README.md" }
    values: { permalink: "/:path/" }

exclude:
  - README.md
  - scripts
  - node_modules
